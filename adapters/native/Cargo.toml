[package]
name = "adapter-native"
version = "0.1.0"
edition = "2024"

[features]
default = ["wasmi"]
wasmi = ["dep:wasmi"]
wavm = ["dep:object"]
wamr = []
wasm3 = []
wasmedge = []
wasmer_llvm = []
wasmer_singlepass = []

[dependencies]
anyhow = "1"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
wasmparser = "=0.251.0"
wasmi = { version = "=2.0.0", optional = true, default-features = false, features = ["std", "validate", "portable-dispatch"] }

object = { version = "=0.37.3", optional = true, default-features = false, features = ["read", "std"] }

[build-dependencies]
cc = "1"

[profile.release]
debug = 1
