[package]
name = "adapter-wasmtime"
version = "0.1.0"
edition = "2024"

[features]
native-allocator = []
native-code-lifetime = ["dep:rustix", "dep:wasmtime-internal-jit-icache-coherence"]
process-snapshot = ["dep:wat"]
component-fixtures = ["dep:wat"]

[dependencies]
anyhow = "1"
hex = "0.4"
serde_json = "1"
sha2 = "0.10"
wasmparser = "=0.251.0"
wasmtime-wasi = { version = "=46.0.1", default-features = false, features = ["p1"] }
base64 = "0.22"
tempfile = "3"
bytes = "1"
tokio = { version = "1", features = ["io-util"] }
async-trait = "0.1"
wat = { version = "=1.251.0", optional = true }
wasmtime = { version = "=46.0.1", default-features = false, features = ["component-model", "cranelift", "winch", "runtime", "std", "parallel-compilation", "pooling-allocator"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.5", features = ["mm", "param"], optional = true }
wasmtime-internal-jit-icache-coherence = { version = "=46.0.1", optional = true }

[[bin]]
name = "component-u64-fixture"
path = "src/bin/component_u64_fixture.rs"
required-features = ["component-fixtures"]

[[bin]]
name = "qualify-process-snapshot"
path = "src/bin/qualify-process-snapshot.rs"
required-features = ["process-snapshot"]

[profile.release]
debug = 1
